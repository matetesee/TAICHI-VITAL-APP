<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TaiChi Vital — Tu App de Entrenamiento</title>
<meta name="description" content="Tu plan de Tai Chi y Yoga en Silla: entrenamientos, comidas, progreso e imprimibles.">
<meta name="robots" content="noindex">
</head>
<body>

<!-- ============================================================= -->
<!--  TAICHI VITAL · App (post-compra)                               -->
<!--  Inspirada en la estructura real de soonbody.com/app, con       -->
<!--  contenido y marca propios.                                     -->
<!--                                                                  -->
<!--  IMPORTANTE: no hay backend todavia.                             -->
<!--  - La "cuenta" (registro/login) vive SOLO en este dispositivo    -->
<!--    (localStorage). No es una cuenta real sincronizada ni         -->
<!--    protegida con seguridad de verdad — sirve para no pedir los   -->
<!--    datos cada vez que se abre la app en el mismo celular.        -->
<!--  - Todo el registro (agua, calorias, peso, animo, racha) vive    -->
<!--    tambien en localStorage del dispositivo.                     -->
<!--  Ver README para el detalle de que falta para produccion real.  -->
<!-- ============================================================= -->

<div id="tv">
  <main class="tv-stage" id="tvStage"></main>
  <nav class="tv-tabs" id="tvTabs">
    <button data-r="home"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h4v-6h4v6h4V10.5"/></svg></span><span data-t="nav_home">Mi Camino</span></button>
    <button data-r="workouts"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="18" x2="6" y2="10"/><line x1="12" y1="18" x2="12" y2="6"/><line x1="18" y1="18" x2="18" y2="13"/></svg></span><span data-t="nav_workouts">Entrenam.</span></button>
    <button data-r="meals"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v6a2 2 0 0 0 4 0V3"/><line x1="9" y1="3" x2="9" y2="21"/><path d="M16 3c1.5 2.5 1.5 6.5 0 8-.4.5-.8.6-.8.6V21"/></svg></span><span data-t="nav_meals">Comidas</span></button>
    <button data-r="progress"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><line x1="8" y1="15" x2="8" y2="17"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="16" y1="8" x2="16" y2="17"/></svg></span><span data-t="nav_progress">Progreso</span></button>
    <button data-r="printables"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5h12v15l-6-4-6 4z"/></svg></span><span data-t="nav_printables">Tutoriales</span></button>
  </nav>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
:root{
  --bg:#F6F8F5; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F0F3EE; --line:#DCE3D8;
  --ink:#1C2A24; --soft:#5E6F65;
  --bronze:#155450; --bronze2:#0F8A7B; --crimson:#C2410C; --crimson2:#D14A0A;
  --shadow:0 10px 28px rgba(21,84,80,.10);
}
html[data-theme="dark"]{
  --bg:#101714; --bg2:#182420; --card:#182420; --card2:#1F2D27; --line:#2B3B34;
  --ink:#EAF2EE; --soft:#8FA79C;
  --bronze:#1F8A79; --bronze2:#2FBBA3; --crimson:#D14A0A; --crimson2:#E8611C;
  --shadow:0 10px 28px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0;background:var(--bg)}
#tv,#tv *{box-sizing:border-box;margin:0;padding:0}
#tv{
  font-family:'Red Hat Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg);
  max-width:520px; margin:0 auto; min-height:100vh; position:relative;
  -webkit-font-smoothing:antialiased; padding-bottom:74px;
  transition:background .2s,color .2s;
}
#tv h1,#tv h2,#tv h3{font-family:'Poppins',sans-serif;font-weight:700;line-height:1.2}
#tv button{font-family:inherit;cursor:pointer}
#tv a{color:inherit;text-decoration:none}

/* ===== top bars ===== */
#tv .tv-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
#tv .tv-streak{display:flex;align-items:center;gap:6px;font-family:'Poppins';font-weight:700;font-size:14px}
#tv .tv-streak-warn{background:rgba(194,65,12,.1);border:1.5px solid var(--crimson);color:var(--crimson);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin:12px 0;line-height:1.4}
#tv .tv-streak-warn.lost{background:var(--card2);border-color:var(--line);color:var(--soft)}
#tv .tv-gear{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink)}
#tv .tv-pagebar{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
#tv .tv-back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:var(--ink)}
#tv .tv-pagebar h1{font-size:19px}

/* ===== stage ===== */
#tv .tv-stage{padding:0 18px 26px;animation:tvIn .3s ease}
@keyframes tvIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#tv .tv-sec{margin:22px 0 10px;font-size:15px;font-weight:700;font-family:'Poppins'}
#tv .tv-sec .lnk{float:right;font-size:12.5px;font-weight:600;color:var(--bronze2)}

/* ===== cards / banners ===== */
#tv .tv-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
#tv .tv-banner{background:linear-gradient(140deg,var(--bronze),var(--bronze2));color:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#tv .tv-banner b{font-family:'Poppins';font-size:15.5px;display:block;margin-bottom:3px}
#tv .tv-banner p{font-size:12.5px;opacity:.9;line-height:1.4}
#tv .tv-banner .btn{background:#fff;color:var(--bronze);font-weight:700;font-size:13px;padding:9px 16px;border-radius:20px;border:none;white-space:nowrap;flex:none}
#tv .tv-empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
#tv .tv-empty b{display:block;font-family:'Poppins';font-size:15px;margin-bottom:4px}
#tv .tv-empty p{color:var(--soft);font-size:13px;margin-bottom:10px}
#tv .tv-empty .lnk{color:var(--bronze2);font-weight:700;font-size:13.5px}

/* ===== horizontal scroller ===== */
#tv .tv-hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
#tv .tv-testi-card{flex:none;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#tv .tv-testi-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#tv .tv-testi-av{width:34px;height:34px;border-radius:50%;background:var(--bronze2);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
#tv .tv-testi-head b{display:block;font-size:12.5px}
#tv .tv-testi-stars{font-size:10.5px;color:#F5A623}
#tv .tv-testi-card p{font-size:12.5px;color:var(--soft);line-height:1.45;margin:0 0 10px}
#tv .tv-testi-result{display:inline-block;background:var(--card2);color:var(--bronze2);font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px}
#tv .tv-faq .tv-faq-item{border-bottom:1px solid var(--line)}
#tv .tv-faq .tv-faq-item:last-child{border-bottom:none}
#tv .tv-faq-q{width:100%;text-align:left;background:none;border:none;padding:14px 0;font-weight:700;font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-family:inherit}
#tv .tv-faq-arrow{transition:transform .2s;color:var(--soft);flex:none}
#tv .tv-faq-item.open .tv-faq-arrow{transform:rotate(180deg)}
#tv .tv-faq-a{display:none;padding:0 0 14px;font-size:12.5px;color:var(--soft);line-height:1.55}
#tv .tv-faq-item.open .tv-faq-a{display:block}
#tv .tv-hscroll::-webkit-scrollbar{display:none}
#tv .tv-hscroll-visible{padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--bronze2) var(--card2)}
#tv .tv-hscroll-visible::-webkit-scrollbar{display:block;height:6px}
#tv .tv-hscroll-visible::-webkit-scrollbar-track{background:var(--card2);border-radius:10px}
#tv .tv-hscroll-visible::-webkit-scrollbar-thumb{background:var(--bronze2);border-radius:10px}
#tv .tv-wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tv .tv-wcard{position:relative;border-radius:14px;overflow:hidden;height:150px;background:linear-gradient(150deg,var(--bronze2),var(--bronze));box-shadow:var(--shadow)}
#tv .tv-wcard img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
#tv .tv-wcard.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.05) 55%)}
#tv .tv-wcard .lvl{position:absolute;top:8px;left:8px;background:#fff;color:var(--crimson);font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;z-index:2}
#tv .tv-wcard .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.4;color:#fff}
#tv .tv-wcard .wlbl{position:absolute;left:9px;bottom:8px;right:9px;color:#fff;font-family:'Poppins';font-weight:700;font-size:12px;line-height:1.25;z-index:2}
#tv .tv-pcard{flex:none;width:150px;border-radius:14px;overflow:hidden;position:relative;height:110px;background:var(--card2);box-shadow:var(--shadow)}
#tv .tv-pcard img{width:100%;height:100%;object-fit:cover;display:block}
#tv .tv-pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.05) 55%)}
#tv .tv-pcard .badge{position:absolute;top:8px;left:8px;background:#fff;color:var(--crimson);font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;z-index:2}
#tv .tv-pcard .lbl{position:absolute;left:9px;right:9px;bottom:9px;color:#fff;font-family:'Poppins';font-weight:700;font-size:12.5px;line-height:1.25;z-index:2}

/* ===== coach promo ===== */
#tv .tv-coach{background:linear-gradient(140deg,var(--bronze),var(--bronze2));border-radius:16px;padding:16px 18px;color:#fff;display:flex;gap:12px}
#tv .tv-coach .av{width:42px;height:42px;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
#tv .tv-coach .av img{width:100%;height:100%;object-fit:cover;display:block}
#tv .tv-coach .eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;color:#FDE68A;text-transform:uppercase;margin-bottom:3px}
#tv .tv-coach h3{font-size:15.5px;margin-bottom:5px}
#tv .tv-coach p{font-size:12.5px;opacity:.92;line-height:1.4;margin-bottom:10px}
#tv .tv-coach .btn{background:#FDE68A;color:#1A1206;font-weight:800;font-size:13px;padding:9px 16px;border-radius:20px;border:none}

/* ===== check-in / mood ===== */
#tv .tv-mood-row{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
#tv .tv-mood{flex:1;text-align:center;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-size:22px}
#tv .tv-mood span{display:block;font-size:9.5px;font-weight:700;color:var(--soft);margin-top:4px;letter-spacing:.03em}
#tv .tv-mood.sel{border-color:var(--bronze2);background:rgba(15,138,123,.08)}

/* ===== perf tiles ===== */
#tv .tv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tv .tv-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#tv .tv-tile .ic2{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px}
#tv .tv-tile .lab{font-size:12px;color:var(--soft);margin-bottom:2px}
#tv .tv-tile .val{font-family:'Poppins';font-weight:800;font-size:17px}
#tv .tv-tile button{margin-top:10px;width:100%;background:var(--bronze);color:#fff;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:12.5px}
#tv .tv-tile-btns{display:flex;gap:6px;margin-top:10px}
#tv .tv-tile-btns button{margin-top:0;flex:1}
#tv .tv-tile-btns button.mini{flex:0 0 34px;padding:9px 0;background:var(--card2);color:var(--ink);font-size:17px;font-weight:800}
#tv .tv-tile-manual{margin-top:6px;width:100%;background:none;color:var(--bronze2);font-size:11px;font-weight:700;padding:4px;border:none}
#tv .tv-manual-row{display:flex;gap:6px;margin-top:2px}
#tv .tv-manual-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--bg2);color:var(--ink)}
#tv .tv-manual-row button{margin-top:0;width:auto;padding:7px 12px;flex:none}

/* ===== weight ===== */
#tv .tv-weight-row{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
#tv .tv-weight-row input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--bg2)}
#tv .tv-btn{width:100%;background:var(--bronze);color:#fff;border:none;border-radius:11px;padding:13px;font-weight:700;font-size:14px}
#tv .tv-btn.ghost{background:var(--card);color:var(--bronze);border:1.5px solid var(--bronze2)}
#tv .tv-btn:disabled{opacity:.45}

/* ===== printable cards ===== */
#tv .tv-pdf{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
#tv .tv-pdf::-webkit-scrollbar{display:none}
#tv .tv-pdfcard{flex:none;width:108px}
#tv .tv-pdfcard .cov{width:108px;height:140px;border-radius:10px;background:linear-gradient(150deg,var(--bronze),var(--bronze2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
#tv .tv-pdfcard .t{font-size:11.5px;font-weight:700;margin-top:6px;line-height:1.3}
#tv .tv-pdfcard .m{font-size:10.5px;color:var(--soft)}
#tv .tv-tut-progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
#tv .tv-tut-progress .bar{height:8px;background:var(--card2);border-radius:20px;overflow:hidden;margin-top:8px}
#tv .tv-tut-progress .bar i{display:block;height:100%;background:var(--bronze2);border-radius:20px}
#tv .tv-tutrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px;text-decoration:none}
#tv .tv-tutrow.locked{opacity:.55}
#tv .tv-tutrow .cov{width:52px;height:52px;border-radius:12px;background:linear-gradient(150deg,var(--bronze2),var(--bronze));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:none}
#tv .tv-tutrow .cov.locked{background:var(--card2);color:var(--soft)}
#tv .tv-tutrow .info{flex:1;min-width:0}
#tv .tv-tutrow .info b{display:block;font-family:'Poppins';font-size:13.5px;margin-bottom:2px;color:var(--ink)}
#tv .tv-tutrow .info span{font-size:11.5px;color:var(--soft)}
#tv .tv-tutrow .status{font-size:17px;flex:none}
#tv .tv-tut-player{width:100%;border-radius:16px;overflow:hidden;margin-bottom:14px;background:#000}
#tv .tv-tut-player video{width:100%;display:block;max-height:360px}
#tv .tv-tut-placeholder{width:100%;aspect-ratio:16/9;border-radius:16px;background:linear-gradient(150deg,var(--bronze2),var(--bronze));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;margin-bottom:14px;text-align:center;padding:0 20px}
#tv .tv-tut-banner{background:var(--card2);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;color:var(--bronze2);margin-bottom:14px}
#tv .tv-diploma-mini{display:block;background:var(--card2);color:var(--bronze2);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:10px;margin-bottom:10px;text-decoration:none;line-height:1.4}
#tv .tv-diploma-mini:not(.prog){background:linear-gradient(135deg,#123a2f,#0d241d);color:#fff}
#tv .tv-diploma-cta{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#123a2f,#0d241d);border:1px solid var(--bronze2);border-radius:14px;padding:14px 16px;margin-bottom:16px;text-decoration:none;font-size:24px}
#tv .tv-diploma-cta div{flex:1}
#tv .tv-diploma-cta b{display:block;font-family:'Poppins';font-size:14px;color:#fff;margin-bottom:2px}
#tv .tv-diploma-cta span{font-size:12px;color:#9fd9c8}
#tv .tv-diploma-cta .arrow{font-size:20px;color:#fff;flex:none}
#tv .tv-diploma-wrap{width:100%;margin-bottom:16px}
#tv .tv-diploma-wrap canvas{width:100%;height:auto;display:block;border-radius:14px;box-shadow:var(--shadow)}

/* ===== bottom nav ===== */
#tv .tv-tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}
#tv .tv-tabs button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--soft);font-size:9.5px;font-weight:600}
#tv .tv-tabs button .ic{display:flex}
#tv .tv-tabs button.on{color:var(--bronze2);font-weight:700}

/* ===== filters / pills ===== */
#tv .tv-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
#tv .tv-pills::-webkit-scrollbar{display:none}
#tv .tv-pill{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:600;color:var(--ink)}
#tv .tv-pill.on{background:var(--bronze);border-color:var(--bronze);color:#fff}

/* ===== category grid ===== */
#tv .tv-catgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#tv .tv-cat{position:relative;border-radius:16px;overflow:hidden;height:150px;background:var(--card2)}
#tv .tv-cat img{width:100%;height:100%;object-fit:cover}
#tv .tv-cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 60%)}
#tv .tv-cat .badge{position:absolute;top:9px;left:9px;background:#fff;color:var(--crimson);font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;z-index:2}
#tv .tv-cat .lbl{position:absolute;left:11px;bottom:10px;color:#fff;font-family:'Poppins';font-weight:700;font-size:14.5px;z-index:2}

/* ===== program list row ===== */
#tv .tv-prow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:10px}
#tv .tv-prow img{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none}
#tv .tv-prow .info{flex:1;min-width:0}
#tv .tv-prow .info b{display:block;font-family:'Poppins';font-size:13.5px;line-height:1.3;margin-bottom:3px}
#tv .tv-prow .info .meta{font-size:11.5px;color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tv .tv-prow .info .tag{background:var(--card2);color:var(--bronze2);font-weight:700;padding:1px 7px;border-radius:20px;font-size:10px}
#tv .tv-prow .play{width:38px;height:38px;border-radius:50%;background:var(--bronze);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
#tv .tv-prow .icon{width:76px;height:76px;border-radius:12px;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:26px}
#tv .tv-mstats{display:flex;gap:8px;margin:14px 0}
#tv .tv-mstat{flex:1;background:var(--card2);border-radius:12px;padding:10px 4px;text-align:center}
#tv .tv-mstat b{display:block;font-family:'Poppins';font-weight:800;font-size:18px}
#tv .tv-mstat span{font-size:10.5px;color:var(--soft)}
#tv .tv-mstat.kcal b{color:var(--bronze2)}

/* ===================== helpers ===================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d, lang){ return d.toLocaleDateString(lang==='en'?'en-US':'es-ES',{weekday:'long',day:'numeric',month:'short'}); }
// Hash NO criptografico — solo para no guardar la contraseña en texto plano.
// No es seguridad real: la "cuenta" vive entera en este dispositivo.
function simpleHash(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return String(h); }

var DEFAULT_STATE = {
  account:null, // {name, email, passHash}
  session:{loggedIn:false}, personalized:false, tourSeen:false,
  streak:0, lastCheckinDate:null,
  weightUnit:'kg', weight:null, weightLog:[],
  activeProgram:'taichi-full-flow', programDay:{'taichi-full-flow':1}, completedDays:{}, catalogSessions:0,
  activeDiet:null, dietDay:{},
  watchedTutorials:{},
  dailyLog:{},
  settings:{ units:'metric', lang:'es', theme:'light' }
};
var state = load();
function load(){
  try{ var s = JSON.parse(localStorage.getItem('tcv_state')); return s ? Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), s, {settings:Object.assign({},DEFAULT_STATE.settings,s.settings||{})}) : JSON.parse(JSON.stringify(DEFAULT_STATE)); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function save(){ localStorage.setItem('tcv_state', JSON.stringify(state)); applyTheme(); }
function applyTheme(){ document.documentElement.setAttribute('data-theme', state.settings.theme==='dark'?'dark':'light'); }
function today(){
  var tk = todayStr();
  if(!state.dailyLog[tk]) state.dailyLog[tk] = { water:0, cal:0, burned:0, active:0, mood:null, items:[] };
  if(!state.dailyLog[tk].items) state.dailyLog[tk].items = [];
  return state.dailyLog[tk];
}
function logMeal(mealType, name, kcal, p, c, f, recipeId){
  var tt = today();
  tt.items.push({ mealType:mealType||null, name:name, kcal:Math.round(kcal), p:Math.round(p||0), c:Math.round(c||0), f:Math.round(f||0), recipeId:recipeId||null });
  tt.cal += Math.round(kcal);
  save();
}
function todayMacros(){
  var tt = today();
  return (tt.items||[]).reduce(function(a,it){ a.p+=it.p; a.c+=it.c; a.f+=it.f; return a; }, {p:0,c:0,f:0});
}
function hasEatenToday(recipeId){
  var tt = today();
  return (tt.items||[]).some(function(it){ return it.recipeId===recipeId; });
}
function last7(){
  var out=[];
  for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var k=d.toISOString().slice(0,10); out.push({date:k, entry: state.dailyLog[k]||{water:0,cal:0,burned:0,active:0,mood:null}}); }
  return out;
}
function markCheckin(){
  var tk = todayStr();
  if(state.lastCheckinDate === tk) return;
  var y = new Date(); y.setDate(y.getDate()-1); var yStr=y.toISOString().slice(0,10);
  state.streak = (state.lastCheckinDate === yStr) ? state.streak+1 : 1;
  state.lastCheckinDate = tk;
  save();
}

function catalogExtraById(id){ for(var i=0;i<CATALOG_EXTRA.length;i++){ if(CATALOG_EXTRA[i].id===id) return CATALOG_EXTRA[i]; } return null; }
function recipeById(id){
  for(var i=0;i<RECIPES.length;i++){ if(RECIPES[i].id===id) return RECIPES[i]; }
  return catalogExtraById(id);
}
function recipesForDiet(dietId, mealType){ return RECIPES.filter(function(r){ return r.dietId===dietId && r.mealType===mealType; }); }
function genMealDay(diet, day){
  var types = ['Breakfast','Lunch','Dinner','Snack'];
  var meals = types.map(function(mt){
    var pool = recipesForDiet(diet.id, mt);
    if(!pool.length) return null;
    return pool[day % pool.length];
  }).filter(Boolean);
  var kcal = meals.reduce(function(s,m){ return s+m.kcal; },0);
  var p = meals.reduce(function(s,m){ return s+m.p; },0), c = meals.reduce(function(s,m){ return s+m.c; },0), f = meals.reduce(function(s,m){ return s+m.f; },0);
  return { meals:meals, kcal:kcal, p:p, c:c, f:f };
}

function progById(id){ for(var i=0;i<PROGRAMS.length;i++) if(PROGRAMS[i].id===id) return PROGRAMS[i]; return null; }
function genDay(prog, day){
  var pool=prog.pool, n=Math.min(pool.length, 10+((day*3)%6));
  var start=(day*2)%pool.length, list=[];
  for(var i=0;i<n;i++){ list.push(pool[(start+i)%pool.length]); }
  var kcal = Math.round(prog.min*3.6 + (day%5)*4);
  return { min:prog.min, kcal:kcal, exercises:list.map(function(mv,i){
    return { name:mv.name, desc:mv.desc, dur: (30+((i*7)%4)*10)+'s', reps: 3+((i+day)%4) };
  })};
}

  var steps = [t('pers_step1'), t('pers_step2'), t('pers_step3'), t('pers_step4')];
  var html = '<div class="tv-pers">'+
    '<div class="tv-pers-spin" id="persSpin"></div>'+

    '<p>'+t('pers_body')+'</p>'+

  '</div>';
  stage.innerHTML = html;

    state.personalized = true; save();
    render();

  var i = 0;

    var el = $('persStep'+i);

var playerTimer = null, playerState = null;
function catalogItemById(id){ for(var i=0;i<WORKOUT_CATALOG.length;i++){ if(WORKOUT_CATALOG[i].id===id) return WORKOUT_CATALOG[i]; } return null; }
function buildPlayerSpec(kind, id, day){
  if(kind==='c'){
    var w = catalogItemById(id); if(!w) return null;
    var pool = poolForCat(w.cat);
    var exs = pool.map(function(ex,i){
      var kcal = 3 + (i%4) + (w.level==='Advanced'?2:(w.level==='Intermediate'?1:0));
      return { name:ex.name, desc:ex.desc, seconds:60, kcal:kcal };
    });
    return {
      title: tn(w.name), img: w.img, pos: w.pos, exercises: exs,
      onFinish: function(){
        var totalKcal = exs.reduce(function(s,e){ return s+e.kcal; },0);
        var totalMin = Math.round(exs.length*75/60);
        var tt = today(); tt.burned += totalKcal; tt.active += totalMin;
        state.catalogSessions = (state.catalogSessions||0)+1;
        save(); markCheckin();
        return { kcal: totalKcal, min: totalMin };
      },
      exitRoute: 'catalogprogram/'+id
    };
  }
  if(kind==='p'){
    var p = progById(id); if(!p) return null;
    day = Math.max(1, Math.min(p.days, day||1));
    var d = genDay(p, day);
    var exs = d.exercises.map(function(ex){ return { name:ex.name, desc:ex.desc, seconds: parseInt(ex.dur,10)||40, reps:ex.reps, kcal:Math.round(d.kcal/d.exercises.length) }; });
    return {
      title: tn(p.name)+' · '+t('day_prefix')+' '+day, img: p.img, pos:null, exercises: exs,
      onFinish: function(){
        if(!state.completedDays[p.id]) state.completedDays[p.id]={};
        var already = !!state.completedDays[p.id][day];
        if(!already){
          state.completedDays[p.id][day]=true;
          state.activeProgram=p.id; state.programDay[p.id]=Math.min(p.days, day+1);
          var tt=today(); tt.burned+=d.kcal; tt.active+=d.min; save(); markCheckin();
        }
        return { kcal: d.kcal, min: d.min };
      },
      exitRoute: 'program/'+id+'/'+day
    };
  }
  return null;
}
window.startPlayer = function(kind, id, day){
  location.hash = 'player/'+kind+'/'+id+(day?('/'+day):'');
};
function renderPlayer(kind, id, day){
  var spec = buildPlayerSpec(kind, id, day);
  if(!spec){ nav('workouts'); return; }
  playerState = { spec:spec, idx:0, phase:'ready', secondsLeft:3, paused:false, result:null };
  stage.innerHTML = '<div class="tv-player" id="playerStage"></div>';
  paintPlayer();
  if(playerTimer) clearInterval(playerTimer);
  playerTimer = setInterval(tickPlayer, 1000);
}
function tickPlayer(){
  if(!playerState || playerState.paused || playerState.phase==='done') return;
  playerState.secondsLeft--;
  if(playerState.secondsLeft <= 0){ advancePlayer(); }
  paintPlayer();
}
function advancePlayer(){
  var ps = playerState, spec = ps.spec;
  if(ps.phase==='ready'){ ps.phase='work'; ps.secondsLeft = spec.exercises[ps.idx].seconds; return; }
  if(ps.phase==='work'){
    if(ps.idx >= spec.exercises.length-1){ finishPlayer(); return; }
    ps.phase='rest'; ps.secondsLeft=10; return;
  }
  if(ps.phase==='rest'){ ps.idx++; ps.phase='work'; ps.secondsLeft = spec.exercises[ps.idx].seconds; return; }
}
function finishPlayer(){
  var ps = playerState;
  clearInterval(playerTimer); playerTimer=null;
  ps.phase='done';
  ps.result = ps.spec.onFinish();
  paintPlayer();
}
window.tvPlayerPause = function(){ if(playerState){ playerState.paused = !playerState.paused; paintPlayer(); } };
window.tvPlayerSkip = function(){ if(playerState && playerState.phase!=='done'){ advancePlayer(); paintPlayer(); } };
window.tvPlayerExit = function(){
  if(confirm(t('player_exit_confirm'))){
    clearInterval(playerTimer); playerTimer=null;
    var route = playerState ? playerState.spec.exitRoute : 'workouts';
    playerState = null;
    location.replace('#'+route);
  }
};
window.tvPlayerFinishExit = function(){
  var route = playerState ? playerState.spec.exitRoute : 'workouts';
  playerState = null;
  location.replace('#'+route);
};
function paintPlayer(){
  var el = document.getElementById('playerStage'); if(!el || !playerState) return;
  var ps = playerState, spec = ps.spec;
  if(ps.phase==='done'){
    el.innerHTML = '<div class="tv-player-done">'+
      '<div class="ico">🎉</div><h2>'+t('player_done_title')+'</h2><p>'+t('player_done_body')+'</p>'+
      '<div class="tv-player-stats"><div><b>'+ps.result.kcal+'</b><span>'+t('kcal')+'</span></div><div><b>'+ps.result.min+'</b><span>'+t('min')+'</span></div><div><b>'+spec.exercises.length+'</b><span>'+t('prog_exercises')+'</span></div></div>'+
      '<button class="tv-btn" style="max-width:320px" onclick="tvPlayerFinishExit()">'+t('player_finish')+'</button>'+
    '</div>';
    return;
  }
  var ex = spec.exercises[ps.idx];
  var isRest = ps.phase==='rest', isReady = ps.phase==='ready';
  var next = spec.exercises[ps.idx+1];
  var labelEx = isReady ? spec.exercises[0] : (isRest ? (next||ex) : ex);
  var label = tn(labelEx.name);
  var descLabel = labelEx.desc ? tn(labelEx.desc) : '';
  var caption = isReady ? t('player_ready') : (isRest ? t('player_rest') : t('player_exercise')+' '+(ps.idx+1));
  var total = isReady ? 3 : (isRest ? 10 : ex.seconds);
  var pct = Math.max(0, ps.secondsLeft/total);
  var r = 96, circ = 2*Math.PI*r, off = circ*(1-pct);
  var dots = spec.exercises.map(function(e,i){ return '<span class="'+(i<ps.idx?'done':(i===ps.idx?'on':''))+'"></span>'; }).join('');
  var html = '<div class="tv-player-top"><button class="tv-player-exit" onclick="tvPlayerExit()">✕ '+t('player_exit')+'</button><span class="tv-player-count">'+(ps.idx+1)+' '+t('player_of')+' '+spec.exercises.length+'</span></div>';
  html += '<div class="tv-player-dots">'+dots+'</div>';
  html += '<div class="tv-player-phase">'+esc(caption)+'</div>';
  html += '<div class="tv-player-name">'+esc(label)+'</div>';
  if(descLabel) html += '<div class="tv-player-desc">'+esc(descLabel)+'</div>';
  html += '<div class="tv-ring-wrap"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="110" cy="110" r="'+r+'" fill="none" stroke="var(--bronze2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg><div class="tv-ring-time">'+Math.max(0,ps.secondsLeft)+'</div></div>';
  if(!isReady && !isRest && next) html += '<div class="tv-player-next">'+t('player_up_next')+': <b>'+esc(tn(next.name))+'</b></div>';
  html += '<div class="tv-player-controls"><button class="tv-btn ghost" onclick="tvPlayerPause()">'+(ps.paused?t('player_resume'):t('player_pause'))+'</button><button class="tv-btn" onclick="tvPlayerSkip()">'+t('player_skip')+'</button></div>';
  el.innerHTML = html;
}

function setupDaysScroll(){
  var wrap = stage.querySelector('.tv-days-wrap');
  if(!wrap) return;
  var days = wrap.querySelector('.tv-days');
  var fadeL = wrap.querySelector('.tv-days-fade-l');
  var fadeR = wrap.querySelector('.tv-days-fade-r');
  var track = wrap.querySelector('.tv-days-track');
  var thumb = wrap.querySelector('.tv-days-thumb');
  if(!days) return;
  function layoutThumb(){
    if(!track || !thumb) return;
    var trackW = track.clientWidth;
    if(!trackW){ thumb.style.width='100%'; thumb.style.left='0'; return; }
    var ratio = Math.min(1, days.clientWidth / days.scrollWidth);
    var thumbW = Math.max(28, trackW * ratio);
    var maxThumbLeft = Math.max(0, trackW - thumbW);
    var maxScroll = days.scrollWidth - days.clientWidth;
    var left = maxScroll > 0 ? (days.scrollLeft / maxScroll) * maxThumbLeft : 0;
    thumb.style.width = thumbW + 'px';
    thumb.style.left = left + 'px';
  }
  function update(){
    var max = days.scrollWidth - days.clientWidth;
    if(fadeL) fadeL.style.opacity = days.scrollLeft > 4 ? '1' : '0';
    if(fadeR) fadeR.style.opacity = (max - days.scrollLeft > 4) ? '1' : '0';
    layoutThumb();
  }
  var on = days.querySelector('.tv-day.on');
  if(on){
    var target = on.offsetLeft - (days.clientWidth/2) + (on.offsetWidth/2);
    days.scrollLeft = Math.max(0, Math.min(target, days.scrollWidth - days.clientWidth));
  }
  update();
  days.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  if(track && thumb){
    var dragging = false;
    var scrollToClientX = function(clientX){
      var rect = track.getBoundingClientRect();
      var trackW = rect.width;
      var ratio = Math.min(1, days.clientWidth / days.scrollWidth);
      var thumbW = Math.max(28, trackW * ratio);
      var maxThumbLeft = Math.max(0, trackW - thumbW);
      var x = Math.max(0, Math.min(clientX - rect.left - thumbW/2, maxThumbLeft));
      var maxScroll = days.scrollWidth - days.clientWidth;
      days.scrollLeft = maxThumbLeft > 0 ? (x / maxThumbLeft) * maxScroll : 0;
    };
    track.addEventListener('pointerdown', function(e){
      dragging = true;
      try{ track.setPointerCapture(e.pointerId); }catch(err){}
      scrollToClientX(e.clientX);
    });
    track.addEventListener('pointermove', function(e){ if(dragging) scrollToClientX(e.clientX); });
    track.addEventListener('pointerup', function(){ dragging = false; });
    track.addEventListener('pointercancel', function(){ dragging = false; });
  }
}

/* ===================== PROGRESS ===================== */
function sparkline(vals, color){
  var w=280,h=54,max=Math.max(1,Math.max.apply(null,vals));
  var pts = vals.map(function(v,i){ return [i/(vals.length-1)*w, h-(v/max)*h*0.85-4]; });
  var d = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function renderProgress(){
  var tt = today(), week = last7();
  var totalDays = Object.keys(state.dailyLog).filter(function(k){ var e=state.dailyLog[k]; return e.active>0 || e.burned>0; }).length;
  var totalWorkouts = state.catalogSessions||0; Object.keys(state.completedDays).forEach(function(id){ totalWorkouts += Object.keys(state.completedDays[id]).length; });
  var moods=[{k:'low',e:'😔',l:t('mood_low')},{k:'steady',e:'😐',l:t('mood_steady')},{k:'great',e:'😊',l:t('mood_great')},{k:'peak',e:'🔥',l:t('mood_peak')}];
  var moodCounts={}; Object.keys(state.dailyLog).forEach(function(k){ var m=state.dailyLog[k].mood; if(m) moodCounts[m]=(moodCounts[m]||0)+1; });
  var topMood = Object.keys(moodCounts).sort(function(a,b){return moodCounts[b]-moodCounts[a];})[0];

  html += '<div class="tv-sec">'+t('prog_general')+'</div><div class="tv-grid2">'+

    '<div class="tv-tile"><div class="ic2">🏋️</div><div class="lab">'+t('prog_total_workouts')+'</div><div class="val">'+totalWorkouts+'</div></div>'+
  '</div>';

  html += '<div class="tv-sec">'+t('prog_avg_mood')+'</div><div class="tv-mood-row">'+

  '</div><div class="tv-days-track" id="testiTrack"><div class="tv-days-thumb" id="testiThumb"></div></div>';

  stage.innerHTML = html;
  setupTestiScroll();
}

  if(!scroller || !track || !thumb) return;
  function layout(){
    var trackW = track.clientWidth;
    var ratio = Math.min(1, scroller.clientWidth / scroller.scrollWidth);
    var thumbW = Math.max(28, trackW*ratio);
    var maxThumbLeft = Math.max(0, trackW-thumbW);
    var maxScroll = scroller.scrollWidth - scroller.clientWidth;
    var left = maxScroll>0 ? (scroller.scrollLeft/maxScroll)*maxThumbLeft : 0;
    thumb.style.width = thumbW+'px'; thumb.style.left = left+'px';
  }
  layout();
  scroller.addEventListener('scroll', layout);
  window.addEventListener('resize', layout);
  var dragging = false;
  function scrollToClientX(clientX){
    var rect = track.getBoundingClientRect();
    var trackW = rect.width;
    var ratio = Math.min(1, scroller.clientWidth/scroller.scrollWidth);
    var thumbW = Math.max(28, trackW*ratio);
    var maxThumbLeft = Math.max(0, trackW-thumbW);
    var x = Math.max(0, Math.min(clientX-rect.left-thumbW/2, maxThumbLeft));
    var maxScroll = scroller.scrollWidth - scroller.clientWidth;
    scroller.scrollLeft = maxThumbLeft>0 ? (x/maxThumbLeft)*maxScroll : 0;
  }
  track.addEventListener('pointerdown', function(e){ dragging=true; try{ track.setPointerCapture(e.pointerId); }catch(err){} scrollToClientX(e.clientX); });
  track.addEventListener('pointermove', function(e){ if(dragging) scrollToClientX(e.clientX); });
  track.addEventListener('pointerup', function(){ dragging=false; });
  track.addEventListener('pointercancel', function(){ dragging=false; });
}

  list.forEach(function(tu,i){
    var unlocked = tutorialUnlocked(i, list);
    var watched = !!state.watchedTutorials[tu.id];

      html += '<a href="#tutorial/'+tu.id+'" class="tv-tutrow"><div class="cov">🎬</div><div class="info"><b>'+esc(tn(tu.name))+'</b><span>'+tu.min+' '+t('min')+'</span></div><div class="status">'+status+'</div></a>';
    } else {
      html += '<div class="tv-tutrow locked"><div class="cov locked">🎬</div><div class="info"><b>'+esc(tn(tu.name))+'</b><span>'+t('tut_locked')+'</span></div><div class="status">'+status+'</div></div>';
    }
  });
  return html;
}

function allWatched(list){
  return list.length>0 && list.every(function(tu){ return !!state.watchedTutorials[tu.id]; });
}
function allTutorialsWatched(){
  return allWatched(TUTORIALS) || allWatched(TUTORIALS_SILLA);
}
function renderDiploma(track){
  if(!allTutorialsWatched()){ nav('printables'); return; }
  track = (track==='silla') ? 'silla' : 'taichi';
  if(track==='taichi' && !allWatched(TUTORIALS) && allWatched(TUTORIALS_SILLA)) track = 'silla';
  if(track==='silla' && !allWatched(TUTORIALS_SILLA) && allWatched(TUTORIALS)) track = 'taichi';
  var html = '<div class="tv-pagebar"><button class="tv-back" onclick="history.back()">‹</button><h1>'+t('diploma_title')+'</h1></div>';
  html += '<div class="tv-diploma-wrap"><canvas id="diplomaCanvas"></canvas></div>';
  html += '<button class="tv-btn" id="diplomaDownload">⬇ '+t('diploma_download')+'</button>';
  stage.innerHTML = html;
  drawDiploma(track);
}
function drawSpacedText(ctx, text, cx, y, spacing){
  var chars = text.split('');
  var totalWidth = chars.reduce(function(w,c){ return w + ctx.measureText(c).width + spacing; }, -spacing);
  var x = cx - totalWidth/2;
  var prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach(function(c){ ctx.fillText(c, x, y); x += ctx.measureText(c).width + spacing; });
  ctx.textAlign = prevAlign;
}
function drawDiploma(track){
  var canvas = $('diplomaCanvas'); if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var accent = (track==='silla') ? '#f2b74b' : '#2dd4a8';
  var fileName = (track==='silla') ? 'diploma-tai-chi-en-silla.png' : 'diploma-tai-chi-vital.png';
  var img = new Image();
  img.onload = function(){
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
    var name = (state.account && state.account.name) ? state.account.name : '';
    var finish = function(){
      ctx.textAlign = 'center';
      ctx.fillStyle = accent;
      ctx.font = "700 " + Math.round(canvas.width*0.017) + "px 'Poppins', sans-serif";
      drawSpacedText(ctx, t('diploma_awarded_to').toUpperCase(), canvas.width/2, canvas.height*0.675, 4);
      var maxWidth = canvas.width * 0.8;
      var fontSize = Math.round(canvas.width*0.048);
      ctx.fillStyle = '#ffffff';
      do {
        ctx.font = "800 " + fontSize + "px 'Poppins', sans-serif";
        fontSize -= 4;
      } while (ctx.measureText(name).width > maxWidth && fontSize > 28);
      var nameY = canvas.height*0.74;
      ctx.fillText(name, canvas.width/2, nameY);
      var w = Math.min(maxWidth, ctx.measureText(name).width);
      ctx.strokeStyle = accent;
      ctx.lineWidth = Math.max(2, canvas.width*0.0017);
      ctx.beginPath();
      ctx.moveTo(canvas.width/2 - w/2 - 24, nameY + canvas.height*0.018);
      ctx.lineTo(canvas.width/2 + w/2 + 24, nameY + canvas.height*0.018);
      ctx.stroke();
      var dl = $('diplomaDownload');
      if(dl) dl.onclick = function(){
        var a = document.createElement('a');
        a.download = fileName;
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a); a.click(); a.remove();
      };
    };
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(finish); } else { finish(); }
  };
  img.src = (track==='silla') ? 'images/diploma-template-silla.png' : 'images/diploma-template.png';
}
function renderTutorialDetail(id){
  var list = tutorialTrackOf(id);
  var i = list ? tutorialIndex(id) : -1;
  if(i===-1 || !tutorialUnlocked(i, list)){ nav('printables'); return; }
  var tu = list[i];
  var watched = !!state.watchedTutorials[tu.id];
  var next = list[i+1];
  var html = '<div class="tv-pagebar"><button class="tv-back" onclick="history.back()">‹</button><h1>'+esc(tn(tu.name))+'</h1></div>';
  if(tu.video){
    html += '<div class="tv-tut-player"><video id="tutVideo" controls preload="metadata" src="'+esc(tu.video)+'"></video></div>';
    html += '<button class="tv-btn'+(watched?' ghost':'')+'" onclick="tvMarkTutorialWatched(\''+tu.id+'\')" style="margin-bottom:6px">✓ '+(watched?t('tut_watched_done'):t('tut_mark_watched'))+'</button>';
    if(!watched) html += '<p style="color:var(--soft);font-size:11.5px;text-align:center;margin:0 0 16px">'+t('tut_watch_hint')+'</p>';
  } else {
    html += '<div class="tv-tut-placeholder">🎬 '+t('tut_coming_soon')+'</div>';
  }
  html += '<p style="color:var(--soft);font-size:13px;margin-bottom:14px">'+tu.min+' '+t('min')+(watched?' · '+t('tut_completed')+' ✅':'')+'</p>';
  html += '<div class="tv-sec">'+t('tut_about')+'</div><p style="color:var(--soft);font-size:13.5px;margin-bottom:16px">'+esc(tn(tu.desc))+'</p>';
  if(watched && next){
    html += '<div class="tv-tut-banner">🔓 '+t('tut_completed_banner')+'</div>';
    html += '<a href="#tutorial/'+next.id+'" class="tv-btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">'+t('tut_next')+'</a>';
  }
  stage.innerHTML = html;
}
window.tvMarkTutorialWatched = function(id){
  if(state.watchedTutorials[id]) return;
  state.watchedTutorials[id] = true;
  save();
  renderTutorialDetail(id);
};

  var acc = state.account || {name:'',email:''};
  var initial = (acc.name||'?').charAt(0).toUpperCase();
  var avInner = acc.photo ? '<img src="'+acc.photo+'" alt="">' : initial;
  var html = '<div class="tv-pagebar"><button class="tv-back" onclick="history.back()">‹</button><h1>'+t('set_title')+'</h1></div>';
  html += '<div class="tv-prof"><div class="tv-avatar-wrap"><div class="av">'+avInner+'</div><button class="av-edit" onclick="document.getElementById(\'avatarFile\').click()" title="'+esc(t('set_avatar_edit'))+'">📷</button></div>'+
    '<input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="tvAvatarChange(this)">'+
    '<b>'+esc(acc.name||'')+'</b><span>'+esc(acc.email||'')+'</span><span>'+t('set_local_account')+'</span>'+
    (acc.photo ? '<button class="av-remove" onclick="tvRemoveAvatar()">'+t('set_avatar_remove')+'</button>' : '')+
  '</div>';
  html += '<div class="tv-sec">'+t('set_account_cfg')+'</div><div class="tv-card">'+
    '<div class="tv-setrow"><span>'+t('set_units')+'</span><div class="tv-seg"><button data-u="metric" class="'+(state.settings.units==='metric'?'on':'')+'">'+t('set_metric')+'</button><button data-u="imperial" class="'+(state.settings.units==='imperial'?'on':'')+'">'+t('set_imperial')+'</button></div></div>'+
    '<div class="tv-setrow"><span>'+t('set_theme')+'</span><div class="tv-seg"><button data-th="light" class="'+(state.settings.theme==='light'?'on':'')+'">'+t('set_theme_light')+'</button><button data-th="dark" class="'+(state.settings.theme==='dark'?'on':'')+'">'+t('set_theme_dark')+'</button></div></div>'+
    '<div class="tv-setrow"><span>'+t('set_lang')+'</span><div class="tv-seg"><button data-lg="es" class="'+(state.settings.lang==='es'?'on':'')+'">Español</button><button data-lg="en" class="'+(state.settings.lang==='en'?'on':'')+'">English</button></div></div>'+
  '</div>';
  html += '<div class="tv-card" style="margin-top:14px"><div class="tv-linklist">'+
    '<a href="mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent(t('contact_subject'))+'">'+t('set_contact')+'</a><a href="#">'+t('set_privacy')+'</a><a href="#">'+t('set_terms')+'</a></div>'+
    '<p style="color:var(--soft);font-size:12px;line-height:1.5;padding:0 14px 14px;margin:0">'+t('contact_note')+' <a href="mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent(t('contact_subject'))+'" style="color:var(--bronze2);font-weight:700">'+CONTACT_EMAIL+'</a></p>'+
  '</div>';
  html += '<div class="tv-sec" style="margin-top:14px">'+t('faq_title')+'</div><div class="tv-card tv-faq">'+
    FAQ.map(function(f,i){ return '<div class="tv-faq-item"><button class="tv-faq-q" data-i="'+i+'">'+esc(tn(f.q))+'<span class="tv-faq-arrow">▾</span></button><div class="tv-faq-a">'+esc(tn(f.a))+'</div></div>'; }).join('')+
  '</div>';
  html += '<button class="tv-logout" onclick="tvLogout()">'+t('set_logout')+'</button><div class="tv-ver">'+t('set_version')+'</div>';
  stage.innerHTML = html;
  stage.querySelectorAll('[data-u]').forEach(function(b){ b.onclick=function(){
    var newUnit = b.dataset.u;

    var toLb = newUnit==='imperial';
    var conv = function(v){ return Math.round((toLb ? v*2.20462 : v/2.20462)*10)/10; };
    if(state.weight) state.weight = conv(state.weight);
    if(state.weightLog && state.weightLog.length) state.weightLog = state.weightLog.map(function(e){ return {date:e.date, v:conv(e.v)}; });
    state.settings.units = newUnit;
    state.weightUnit = toLb ? 'lb' : 'kg';
    save(); renderSettings();
  }; });
  stage.querySelectorAll('[data-th]').forEach(function(b){ b.onclick=function(){ state.settings.theme=b.dataset.th; save(); renderSettings(); }; });
  stage.querySelectorAll('[data-lg]').forEach(function(b){ b.onclick=function(){ state.settings.lang=b.dataset.lg; save(); renderSettings(); }; });
  stage.querySelectorAll('.tv-faq-q').forEach(function(b){ b.onclick=function(){ b.parentElement.classList.toggle('open'); }; });
}
window.tvAvatarChange = function(input){
  var file = input.files && input.files[0];
  if(!file || !state.account) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var size = 320;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      var side = Math.min(img.width, img.height);
      var sx = (img.width-side)/2, sy = (img.height-side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      state.account.photo = canvas.toDataURL('image/jpeg', 0.85);
      save();
      renderSettings();
    };
    img.onerror = function(){ alert(t('set_avatar_err')); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ alert(t('set_avatar_err')); };
  reader.readAsDataURL(file);
  input.value = '';
};
window.tvRemoveAvatar = function(){
  if(!state.account) return;
  state.account.photo = null;
  save();
  renderSettings();
};

applyTheme();
render();
