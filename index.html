<!-- ============================================================= -->
<!--  TAICHI VITAL · App (post-compra)                               -->
<!--  Inspirada en la estructura real de soonbody.com/app, con       -->
<!--  contenido y marca propios.                                     -->
<!--                                                                  -->
<!--  IMPORTANTE: no hay backend todavia.                             -->
<!--  - La "cuenta" (registro/login) vive SOLO en este dispositivo    -->
<!--    (localStorage). No es una cuenta real sincronizada ni         -->
<!--    protegida con seguridad de verdad — sirve para no pedir los   -->
<!--    datos cada vez que se abre la app en el mismo celular.        -->
<!--  - Todo el registro (agua, calorias, peso, animo, racha) vive    -->
<!--    tambien en localStorage del dispositivo.                     -->
<!--  Ver README para el detalle de que falta para produccion real.  -->
<!-- ============================================================= -->

  <nav class="tv-tabs" id="tvTabs">

    <button data-r="workouts"><span class="ic">🧘</span><span data-t="nav_workouts">Entrenam.</span></button>
    <button data-r="meals"><span class="ic">🍽️</span><span data-t="nav_meals">Comidas</span></button>
    <button data-r="progress"><span class="ic">📈</span><span data-t="nav_progress">Progreso</span></button>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
:root{
  --bg:#F6F8F5; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F0F3EE; --line:#DCE3D8;
  --ink:#1C2A24; --soft:#5E6F65;
  --bronze:#155450; --bronze2:#0F8A7B; --crimson:#C2410C; --crimson2:#D14A0A;
  --shadow:0 10px 28px rgba(21,84,80,.10);
}
html[data-theme="dark"]{
  --bg:#101714; --bg2:#182420; --card:#182420; --card2:#1F2D27; --line:#2B3B34;
  --ink:#EAF2EE; --soft:#8FA79C;
  --bronze:#1F8A79; --bronze2:#2FBBA3; --crimson:#D14A0A; --crimson2:#E8611C;
  --shadow:0 10px 28px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0;background:var(--bg)}
#tv,#tv *{box-sizing:border-box;margin:0;padding:0}
#tv{
  font-family:'Red Hat Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg);
  max-width:520px; margin:0 auto; min-height:100vh; position:relative;
  -webkit-font-smoothing:antialiased; padding-bottom:74px;
  transition:background .2s,color .2s;
}
#tv h1,#tv h2,#tv h3{font-family:'Poppins',sans-serif;font-weight:700;line-height:1.2}
#tv button{font-family:inherit;cursor:pointer}
#tv a{color:inherit;text-decoration:none}

/* ===== top bars ===== */
#tv .tv-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
#tv .tv-streak{display:flex;align-items:center;gap:6px;font-family:'Poppins';font-weight:700;font-size:14px}
#tv .tv-gear{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink)}
#tv .tv-pagebar{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
#tv .tv-back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:var(--ink)}
#tv .tv-pagebar h1{font-size:19px}

/* ===== stage ===== */
#tv .tv-stage{padding:0 18px 26px;animation:tvIn .3s ease}
@keyframes tvIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#tv .tv-sec{margin:22px 0 10px;font-size:15px;font-weight:700;font-family:'Poppins'}
#tv .tv-sec .lnk{float:right;font-size:12.5px;font-weight:600;color:var(--bronze2)}

/* ===== cards / banners ===== */
#tv .tv-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
#tv .tv-banner{background:linear-gradient(140deg,var(--bronze),var(--bronze2));color:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#tv .tv-banner b{font-family:'Poppins';font-size:15.5px;display:block;margin-bottom:3px}
#tv .tv-banner p{font-size:12.5px;opacity:.9;line-height:1.4}
#tv .tv-banner .btn{background:#fff;color:var(--bronze);font-weight:700;font-size:13px;padding:9px 16px;border-radius:20px;border:none;white-space:nowrap;flex:none}
#tv .tv-empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
#tv .tv-empty b{display:block;font-family:'Poppins';font-size:15px;margin-bottom:4px}
#tv .tv-empty p{color:var(--soft);font-size:13px;margin-bottom:10px}
#tv .tv-empty .lnk{color:var(--bronze2);font-weight:700;font-size:13.5px}

/* ===== horizontal scroller ===== */
#tv .tv-hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
#tv .tv-hscroll::-webkit-scrollbar{display:none}
#tv .tv-hscroll-visible{padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--bronze2) var(--card2)}
#tv .tv-hscroll-visible::-webkit-scrollbar{display:block;height:6px}
#tv .tv-hscroll-visible::-webkit-scrollbar-track{background:var(--card2);border-radius:10px}
#tv .tv-hscroll-visible::-webkit-scrollbar-thumb{background:var(--bronze2);border-radius:10px}
#tv .tv-pcard{flex:none;width:150px;border-radius:14px;overflow:hidden;position:relative;height:110px;background:var(--card2);box-shadow:var(--shadow)}
#tv .tv-pcard img{width:100%;height:100%;object-fit:cover;display:block}
#tv .tv-pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.05) 55%)}
#tv .tv-pcard .badge{position:absolute;top:8px;left:8px;background:#fff;color:var(--crimson);font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;z-index:2}
#tv .tv-pcard .lbl{position:absolute;left:9px;right:9px;bottom:9px;color:#fff;font-family:'Poppins';font-weight:700;font-size:12.5px;line-height:1.25;z-index:2}

/* ===== coach promo ===== */
#tv .tv-coach{background:linear-gradient(140deg,var(--bronze),var(--bronze2));border-radius:16px;padding:16px 18px;color:#fff;display:flex;gap:12px}
#tv .tv-coach .av{width:42px;height:42px;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
#tv .tv-coach .eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;color:#FDE68A;text-transform:uppercase;margin-bottom:3px}
#tv .tv-coach h3{font-size:15.5px;margin-bottom:5px}
#tv .tv-coach p{font-size:12.5px;opacity:.92;line-height:1.4;margin-bottom:10px}
#tv .tv-coach .btn{background:#FDE68A;color:#1A1206;font-weight:800;font-size:13px;padding:9px 16px;border-radius:20px;border:none}

/* ===== check-in / mood ===== */
#tv .tv-mood-row{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
#tv .tv-mood{flex:1;text-align:center;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-size:22px}
#tv .tv-mood span{display:block;font-size:9.5px;font-weight:700;color:var(--soft);margin-top:4px;letter-spacing:.03em}
#tv .tv-mood.sel{border-color:var(--bronze2);background:rgba(15,138,123,.08)}

/* ===== perf tiles ===== */
#tv .tv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tv .tv-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#tv .tv-tile .ic2{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px}
#tv .tv-tile .lab{font-size:12px;color:var(--soft);margin-bottom:2px}
#tv .tv-tile .val{font-family:'Poppins';font-weight:800;font-size:17px}
#tv .tv-tile button{margin-top:10px;width:100%;background:var(--bronze);color:#fff;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:12.5px}

/* ===== weight ===== */
#tv .tv-weight-row{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
#tv .tv-weight-row input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--bg2)}
#tv .tv-btn{width:100%;background:var(--bronze);color:#fff;border:none;border-radius:11px;padding:13px;font-weight:700;font-size:14px}
#tv .tv-btn.ghost{background:var(--card);color:var(--bronze);border:1.5px solid var(--bronze2)}
#tv .tv-btn:disabled{opacity:.45}

/* ===== printable cards ===== */
#tv .tv-pdf{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
#tv .tv-pdf::-webkit-scrollbar{display:none}
#tv .tv-pdfcard{flex:none;width:108px}
#tv .tv-pdfcard .cov{width:108px;height:140px;border-radius:10px;background:linear-gradient(150deg,var(--bronze),var(--bronze2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
#tv .tv-pdfcard .t{font-size:11.5px;font-weight:700;margin-top:6px;line-height:1.3}
#tv .tv-pdfcard .m{font-size:10.5px;color:var(--soft)}

/* ===== bottom nav ===== */
#tv .tv-tabs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;box-shadow:0 12px 28px rgba(21,84,80,.18);z-index:10}
#tv .tv-tabs button{flex:1;background:none;border:none;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft);font-size:9.5px;font-weight:700}
#tv .tv-tabs button .ic{font-size:18px}
#tv .tv-tabs button.on{color:var(--bronze2)}

/* ===== filters / pills ===== */
#tv .tv-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
#tv .tv-pills::-webkit-scrollbar{display:none}
#tv .tv-pill{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:600;color:var(--ink)}
#tv .tv-pill.on{background:var(--bronze);border-color:var(--bronze);color:#fff}

/* ===== category grid ===== */
#tv .tv-catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tv .tv-cat{position:relative;border-radius:14px;overflow:hidden;height:96px;background:var(--card2)}
#tv .tv-cat img{width:100%;height:100%;object-fit:cover}
#tv .tv-cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 60%)}
#tv .tv-cat .badge{position:absolute;top:7px;left:7px;background:#fff;color:var(--crimson);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;z-index:2}
#tv .tv-cat .lbl{position:absolute;left:9px;bottom:8px;color:#fff;font-family:'Poppins';font-weight:700;font-size:13px;z-index:2}

/* ===== program list row ===== */
#tv .tv-prow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:10px}
#tv .tv-prow img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}
#tv .tv-prow .info{flex:1;min-width:0}
#tv .tv-prow .info b{display:block;font-family:'Poppins';font-size:13.5px;line-height:1.3;margin-bottom:3px}
#tv .tv-prow .info .meta{font-size:11.5px;color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tv .tv-prow .info .tag{background:var(--card2);color:var(--bronze2);font-weight:700;padding:1px 7px;border-radius:20px;font-size:10px}
#tv .tv-prow .play{width:38px;height:38px;border-radius:50%;background:var(--bronze);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}

/* ===== program detail ===== */
#tv .tv-hero{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;margin-bottom:12px}
#tv .tv-hero img{width:100%;height:100%;object-fit:cover}
#tv .tv-hero .tag{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);color:#1C2A24;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
#tv .tv-days{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px}
#tv .tv-days::-webkit-scrollbar{display:none}
#tv .tv-day{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--soft)}
#tv .tv-day.on{background:var(--bronze);border-color:var(--bronze);color:#fff}
#tv .tv-day.done{background:var(--bronze2);border-color:var(--bronze2);color:#fff}
#tv .tv-exrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px}

#tv .tv-exrow .info b{display:block;font-size:13.5px}
#tv .tv-exrow .info span{font-size:11px;color:var(--soft)}

#tv .tv-donut svg{flex:none}
#tv .tv-macro{display:flex;justify-content:space-between;font-size:12.5px;margin:4px 0}

#tv .tv-cta-row{display:flex;gap:10px;margin-top:12px}

#tv .tv-prof{display:flex;flex-direction:column;align-items:center;padding:14px 0 22px}
#tv .tv-prof .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(140deg,var(--bronze2),var(--bronze));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:800;font-size:24px;margin-bottom:10px}
#tv .tv-prof b{font-family:'Poppins';font-size:16px}
#tv .tv-prof span{font-size:12.5px;color:var(--soft)}

#tv .tv-toggle{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;border:none;flex:none}
#tv .tv-toggle.on{background:var(--bronze2)}
#tv .tv-toggle::after{content:"";position:absolute;top:2.5px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
#tv .tv-toggle.on::after{left:21px}
#tv .tv-seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;flex:none}
#tv .tv-seg button{background:none;border:none;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--soft);border-radius:8px;white-space:nowrap}
#tv .tv-seg button.on{background:var(--bronze);color:#fff}
#tv select{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--bg2)}
#tv .tv-linklist a{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
#tv .tv-linklist a:last-child{border-bottom:none}
#tv .tv-logout{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--crimson2);font-weight:700;padding:13px;border-radius:12px;margin-top:20px}
#tv .tv-ver{text-align:center;color:#9AA79C;font-size:11.5px;margin-top:14px}

/* ===== sparkline ===== */
#tv .tv-spark{margin-top:6px}
#tv .tv-spark svg{width:100%;display:block}
#tv .tv-spark .lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--soft);margin-top:3px}
#tv .tv-avg{font-size:12px;color:var(--soft);margin-top:6px}
#tv .tv-avg b{color:var(--ink)}

/* ===== auth screen ===== */
#tv .tv-auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
#tv .tv-auth .brand{text-align:center;margin-bottom:28px}
#tv .tv-auth .brand .logo{font-family:'Poppins';font-weight:800;font-size:22px}
#tv .tv-auth .brand .logo em{font-style:normal;color:var(--bronze2)}
#tv .tv-auth .brand p{color:var(--soft);font-size:13px;margin-top:4px}
#tv .tv-auth-tabs{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:20px}
#tv .tv-auth-tabs button{flex:1;background:none;border:none;padding:11px;font-weight:700;font-size:13.5px;color:var(--soft);border-radius:9px}
#tv .tv-auth-tabs button.on{background:var(--bronze);color:#fff}
#tv .tv-field{margin-bottom:12px}
#tv .tv-field label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px}
#tv .tv-field input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:14.5px;font-family:inherit;color:var(--ink);background:var(--bg2)}
#tv .tv-field input:focus{outline:none;border-color:var(--bronze2)}
#tv .tv-err{color:var(--crimson2);font-size:12.5px;font-weight:600;margin:-4px 0 12px}
#tv .tv-authnote{text-align:center;color:var(--soft);font-size:11.5px;margin-top:16px;line-height:1.5}

/* ===== calendar (unused placeholder kept minimal) ===== */
#tv .tv-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
</style>

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d, lang){ return d.toLocaleDateString(lang==='en'?'en-US':'es-ES',{weekday:'long',day:'numeric',month:'short'}); }
// Hash NO criptografico — solo para no guardar la contraseña en texto plano.
// No es seguridad real: la "cuenta" vive entera en este dispositivo.
function simpleHash(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return String(h); }

var DEFAULT_STATE = {
  account:null, // {name, email, passHash}
  session:{loggedIn:false},
  streak:0, lastCheckinDate:null,
  weightUnit:'kg', weight:null, weightLog:[],
  activeProgram:null, programDay:{}, completedDays:{},

var state = load();
function load(){
  try{ var s = JSON.parse(localStorage.getItem('tcv_state')); return s ? Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), s, {settings:Object.assign({},DEFAULT_STATE.settings,s.settings||{})}) : JSON.parse(JSON.stringify(DEFAULT_STATE)); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function save(){ localStorage.setItem('tcv_state', JSON.stringify(state)); applyTheme(); }
function applyTheme(){ document.documentElement.setAttribute('data-theme', state.settings.theme==='dark'?'dark':'light'); }
function today(){
  var tk = todayStr();
  if(!state.dailyLog[tk]) state.dailyLog[tk] = { water:0, cal:0, burned:0, active:0, mood:null };
  return state.dailyLog[tk];
}
function last7(){
  var out=[];
  for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var k=d.toISOString().slice(0,10); out.push({date:k, entry: state.dailyLog[k]||{water:0,cal:0,burned:0,active:0,mood:null}}); }
  return out;
}
function markCheckin(){
  var tk = todayStr();
  if(state.lastCheckinDate === tk) return;
  var y = new Date(); y.setDate(y.getDate()-1); var yStr=y.toISOString().slice(0,10);
  state.streak = (state.lastCheckinDate === yStr) ? state.streak+1 : 1;
  state.lastCheckinDate = tk;
  save();
}

function progById(id){ for(var i=0;i<PROGRAMS.length;i++) if(PROGRAMS[i].id===id) return PROGRAMS[i]; return null; }
function genDay(prog, day){
  var pool=prog.pool, n=Math.min(pool.length, 10+((day*3)%6));
  var start=(day*2)%pool.length, list=[];
  for(var i=0;i<n;i++){ list.push(pool[(start+i)%pool.length]); }
  var kcal = Math.round(prog.min*3.6 + (day%5)*4);
  return { min:prog.min, kcal:kcal, exercises:list.map(function(name,i){
    return { name:name, dur: (30+((i*7)%4)*10)+'s', reps: 3+((i+day)%4) };
  })};
}

/* ===================== AUTH ===================== */
function renderAuth(mode){
  mode = mode || 'login';
  var html = '<div class="tv-auth"><div class="brand"><div class="logo">TaiChi <em>Vital</em></div><p>'+t('auth_sub')+'</p></div>';
  html += '<div class="tv-auth-tabs"><button data-m="login" class="'+(mode==='login'?'on':'')+'">'+t('auth_login')+'</button><button data-m="register" class="'+(mode==='register'?'on':'')+'">'+t('auth_register')+'</button></div>';
  html += '<div id="authForm">';
  if(mode==='register'){
    html += '<div class="tv-field"><label>'+t('auth_name')+'</label><input id="fName" type="text" autocomplete="name"></div>';
  }
  html += '<div class="tv-field"><label>'+t('auth_email')+'</label><input id="fEmail" type="email" autocomplete="email"></div>';
  html += '<div class="tv-field"><label>'+t('auth_password')+'</label><input id="fPass" type="password" autocomplete="'+(mode==='register'?'new-password':'current-password')+'"></div>';
  html += '<div class="tv-err" id="authErr" style="display:none"></div>';
  html += '<button class="tv-btn" id="authSubmit">'+(mode==='register'?t('auth_register'):t('auth_login'))+'</button>';
  html += '</div>';
  html += '<p class="tv-authnote">'+t('auth_note')+'</p>';
  stage.innerHTML = html;
  tabs.style.display='none';
  stage.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ renderAuth(b.dataset.m); }; });
  $('authSubmit').onclick=function(){ mode==='register' ? doRegister() : doLogin(); };
  stage.querySelectorAll('#authForm input').forEach(function(inp){
    inp.onkeydown=function(e){ if(e.key==='Enter'){ mode==='register' ? doRegister() : doLogin(); } };
  });
}
function authErr(msg){ var e=$('authErr'); e.textContent=msg; e.style.display='block'; }
function doRegister(){
  var name=($('fName').value||'').trim(), email=($('fEmail').value||'').trim().toLowerCase(), pass=$('fPass').value||'';
  if(!name){ return authErr(t('auth_err_name')); }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ return authErr(t('auth_err_email')); }
  if(pass.length<6){ return authErr(t('auth_err_pass')); }
  if(state.account && state.account.email===email){ return authErr(t('auth_err_exists')); }
  state.account = { name:name, email:email, passHash:simpleHash(pass) };
  state.session.loggedIn = true; save();
  render();
}
function doLogin(){
  var email=($('fEmail').value||'').trim().toLowerCase(), pass=$('fPass').value||'';
  if(!state.account || state.account.email!==email || state.account.passHash!==simpleHash(pass)){ return authErr(t('auth_err_nomatch')); }
  state.session.loggedIn = true; save();
  render();
}
window.tvLogout=function(){ state.session.loggedIn=false; save(); location.hash=''; render(); };

function render(){
  applyTheme();
  if(!state.session.loggedIn){ return renderAuth(state.account ? 'login' : 'register'); }
  var hash = location.hash.replace('#','') || 'home';
  var parts = hash.split('/');
  var route = parts[0];
  window.scrollTo({top:0});
  tabs.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.r===route); });
  tabs.style.display = (route==='program' || route==='settings' || route==='browse-diets' || route==='coach') ? 'none' : 'flex';
  if(route==='home') return renderHome();
  if(route==='workouts') return renderWorkouts();
  if(route==='program') return renderProgramDetail(parts[1], parts[2]?parseInt(parts[2],10):1);
  if(route==='meals') return renderMeals();
  if(route==='browse-diets') return renderBrowseDiets();
  if(route==='progress') return renderProgress();
  if(route==='printables') return renderPrintables();
  if(route==='settings') return renderSettings();
  if(route==='coach') return renderCoach();
  renderHome();
}

  html += '<div class="tv-sec">'+t('wk_level')+'</div><div class="tv-pills">'+
    [t('wk_advanced'),t('wk_beginner'),t('wk_intermediate')].map(function(l,i){ return '<div class="tv-pill'+(i===1?' on':'')+'">'+l+'</div>'; }).join('')+'</div>';

  html += '<div class="tv-sec">'+t('wk_categories')+'</div><div class="tv-catgrid">'+
    CATEGORIES.map(function(c){ return '<div class="tv-cat">'+(c.badge?'<span class="badge">🔥 '+c.badge+'</span>':'')+'<img src="'+c.img+'"><span class="lbl">'+esc(c.name)+'</span></div>'; }).join('')+
  '</div>';

  html += '<div class="tv-sec">'+t('wk_programs')+'</div>';
  PROGRAMS.forEach(function(p){
    html += '<a href="#program/'+p.id+'/1" class="tv-prow">'+
      '<img src="'+p.img+'"><div class="info"><b>'+esc(p.name)+'</b><div class="meta">'+(p.badge?'<span class="tag">'+esc(p.badge)+'</span>':'')+'<span>'+p.days+' '+t('wk_days')+'</span><span>⏱ '+p.min+' '+t('wk_min_day')+'</span></div></div>'+
      '<div class="play">▶</div></a>';
  });
  stage.innerHTML = html;
}

function renderProgramDetail(id, day){
  var p = progById(id); if(!p){ nav('workouts'); return; }
  day = Math.max(1, Math.min(p.days, day||1));
  var d = genDay(p, day);
  var done = !!(state.completedDays[p.id] && state.completedDays[p.id][day]);
  var equip = t(p.equipKey);
  var html = '<div class="tv-pagebar"><button class="tv-back" onclick="history.back()">‹</button><h1>'+esc(p.name)+'</h1></div>';
  html += '<div class="tv-hero"><img src="'+p.img+'"><span class="tag">'+esc(equip)+'</span></div>';
  html += '<p style="color:var(--soft);font-size:13px;margin-bottom:14px">'+p.days+' '+t('wk_days')+' · '+p.min+' '+t('min')+'</p>';
  html += '<button class="tv-btn" onclick="tvSetActive(\''+p.id+'\','+day+')">▶ '+t('prog_start')+'</button>';
  html += '<div class="tv-days">';
  for(var i=1;i<=p.days;i++){
    var cls = i===day?'on':(state.completedDays[p.id]&&state.completedDays[p.id][i]?'done':'');
    html += '<a href="#program/'+p.id+'/'+i+'" class="tv-day '+cls+'">'+i+'</a>';
  }
  html += '</div>';
  html += '<div class="tv-sec" style="margin-top:6px">'+t('day_prefix')+' '+day+' <span style="float:right;font-weight:500;color:var(--soft);font-size:12px">'+d.min+' '+t('min')+' · '+d.kcal+' '+t('kcal')+'</span></div>';
  html += '<button class="tv-btn'+(done?' ghost':'')+'" onclick="tvCompleteDay(\''+p.id+'\','+day+','+p.min+','+d.kcal+')">'+(done?t('prog_done'):t('prog_today_btn'))+'</button>';
  html += '<div class="tv-sec">'+t('prog_circuit')+' ('+d.exercises.length+' '+t('prog_exercises')+')</div>';
  d.exercises.forEach(function(ex){
    html += '<div class="tv-exrow"><div class="n">🧘</div><div class="info"><b>'+esc(ex.name)+'</b><span>TaiChi Vital</span></div><div class="dur">'+ex.dur+'<br><span style="font-weight:400;color:var(--soft)">×'+ex.reps+'</span></div></div>';
  });
  stage.innerHTML = html;
}
window.tvSetActive=function(id,day){ state.activeProgram=id; state.programDay[id]=day; save(); };
window.tvCompleteDay=function(id,day,min,kcal){
  if(!state.completedDays[id]) state.completedDays[id]={};
  if(state.completedDays[id][day]) return;
  state.completedDays[id][day]=true;
  state.activeProgram=id; state.programDay[id]=Math.min(progById(id).days, day+1);
  var tt=today(); tt.burned+=kcal; tt.active+=min; save(); markCheckin();
  renderProgramDetail(id, day);
};

    '<div class="tv-macro"><span>'+t('meals_fat')+'</span><b>'+Math.round(tt.cal*0.015)+' / '+goal.f+'g</b></div></div></div>'+
    '<div class="tv-cta-row"><button class="tv-btn" onclick="tvLogCal()">'+t('meals_log')+'</button><button class="tv-btn ghost" onclick="location.hash=\'browse-diets\'">'+t('meals_explore')+'</button></div></div>';

  html += '<div class="tv-sec">'+t('meals_today')+' <span style="float:right;font-weight:500;color:var(--soft);font-size:12px">'+fmtDate(new Date(), state.settings.lang)+'</span></div>';
  if(tt.cal===0){
    html += '<div class="tv-empty">🍽️<b style="margin-top:8px">'+t('meals_empty_title')+'</b><p>'+t('meals_empty_body')+'</p></div>';

/* ===================== PROGRESS ===================== */
function sparkline(vals, color){
  var w=280,h=54,max=Math.max(1,Math.max.apply(null,vals));
  var pts = vals.map(function(v,i){ return [i/(vals.length-1)*w, h-(v/max)*h*0.85-4]; });
  var d = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function renderProgress(){
  var tt = today(), week = last7();
  var totalDays = Object.keys(state.dailyLog).filter(function(k){ var e=state.dailyLog[k]; return e.active>0 || e.burned>0; }).length;
  var totalWorkouts = 0; Object.keys(state.completedDays).forEach(function(id){ totalWorkouts += Object.keys(state.completedDays[id]).length; });
  var moods=[{k:'low',e:'😔',l:t('mood_low')},{k:'steady',e:'😐',l:t('mood_steady')},{k:'great',e:'😊',l:t('mood_great')},{k:'peak',e:'🔥',l:t('mood_peak')}];
  var moodCounts={}; Object.keys(state.dailyLog).forEach(function(k){ var m=state.dailyLog[k].mood; if(m) moodCounts[m]=(moodCounts[m]||0)+1; });
  var topMood = Object.keys(moodCounts).sort(function(a,b){return moodCounts[b]-moodCounts[a];})[0];

  var html = '<div class="tv-top"><h1 style="font-size:20px">'+t('prog_title')+'</h1><button class="tv-gear" onclick="location.hash=\'settings\'">⚙️</button></div>';
  html += '<div class="tv-banner"><div><b>'+t('prog_streak_title')+'</b><p>'+t('prog_streak_body')+'</p></div></div>';

  html += '<div class="tv-sec">'+t('prog_activity')+'</div><div class="tv-grid2">'+
    '<div class="tv-tile"><div class="ic2">🔥</div><div class="lab">'+t('prog_burned')+'</div><div class="val">'+tt.burned+' '+t('kcal')+'</div></div>'+
    '<div class="tv-tile"><div class="ic2">⏱</div><div class="lab">'+t('prog_active')+'</div><div class="val">'+tt.active+' '+t('min')+'</div></div>'+
    '<div class="tv-tile"><div class="ic2">💧</div><div class="lab">'+t('prog_water')+'</div><div class="val">'+tt.water+' ml</div></div>'+
    '<div class="tv-tile"><div class="ic2">🍽️</div><div class="lab">'+t('prog_consumed')+'</div><div class="val">'+tt.cal+' '+t('kcal')+'</div></div>'+
  '</div>';

  html += '<div class="tv-card" style="margin-top:12px"><div style="font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:8px">'+t('prog_weight_track')+'</div><div style="font-family:Poppins;font-weight:800;font-size:20px;margin-bottom:10px">'+(state.weight||'—')+' '+state.weightUnit+'</div><button class="tv-btn" onclick="location.hash=\'home\'">'+t('prog_weight_update')+'</button></div>';

  html += '<div class="tv-sec">'+t('prog_general')+'</div><div class="tv-grid2">'+
    '<div class="tv-tile"><div class="ic2">📅</div><div class="lab">'+t('prog_total_days')+'</div><div class="val">'+totalDays+'</div></div>'+
    '<div class="tv-tile"><div class="ic2">🏋️</div><div class="lab">'+t('prog_total_workouts')+'</div><div class="val">'+totalWorkouts+'</div></div>'+
  '</div>';

  html += '<div class="tv-sec">'+t('prog_avg_mood')+'</div><div class="tv-mood-row">'+
    moods.map(function(m){ return '<div class="tv-mood'+(topMood===m.k?' sel':'')+'">'+m.e+'<span>'+m.l+'</span></div>'; }).join('')+'</div>';

  ['burned','active','water','cal'].forEach(function(key,idx){
    var labels={burned:t('prog_burned'),active:t('prog_active'),water:t('prog_water'),cal:t('prog_consumed')};
    var units={burned:t('kcal'),active:t('min'),water:'ml',cal:t('kcal')};
    var colors=['#D14A0A','#0F8A7B','#3B82F6','#155450'];
    var vals = week.map(function(w){ return w.entry[key]; });
    var avg = Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
    var dayLbls = week.map(function(w){ return new Date(w.date).toLocaleDateString(state.settings.lang==='en'?'en-US':'es-ES',{weekday:'short'}).slice(0,3); });
    html += '<div class="tv-card" style="margin-top:12px"><b style="font-family:Poppins;font-size:13.5px">'+labels[key]+'</b>'+
      '<div class="tv-spark">'+sparkline(vals, colors[idx])+'<div class="lbls">'+dayLbls.map(function(l){return '<span>'+l+'</span>';}).join('')+'</div></div>'+
      '<div class="tv-avg">'+t('prog_avg')+' <b>'+avg+' '+units[key]+'</b></div></div>';
  });

  stage.innerHTML = html;
}

    '<div class="tv-setrow"><span>'+t('set_reminders')+'</span><button class="tv-toggle'+(state.settings.reminders?' on':'')+'" id="remToggle"></button></div>'+
    '<div class="tv-setrow"><span>'+t('set_lang')+'</span><div class="tv-seg"><button data-lg="es" class="'+(state.settings.lang==='es'?'on':'')+'">Español</button><button data-lg="en" class="'+(state.settings.lang==='en'?'on':'')+'">English</button></div></div>'+
  '</div>';
  html += '<div class="tv-card" style="margin-top:14px"><div class="tv-linklist">'+
    '<a href="#">'+t('set_contact')+'</a><a href="#">'+t('set_privacy')+'</a><a href="#">'+t('set_terms')+'</a></div></div>';
  html += '<button class="tv-logout" onclick="tvLogout()">'+t('set_logout')+'</button><div class="tv-ver">'+t('set_version')+'</div>';
  stage.innerHTML = html;
  stage.querySelectorAll('[data-u]').forEach(function(b){ b.onclick=function(){ state.settings.units=b.dataset.u; state.weightUnit = b.dataset.u==='metric'?'kg':'lb'; save(); renderSettings(); }; });
  stage.querySelectorAll('[data-th]').forEach(function(b){ b.onclick=function(){ state.settings.theme=b.dataset.th; save(); renderSettings(); }; });
  stage.querySelectorAll('[data-lg]').forEach(function(b){ b.onclick=function(){ state.settings.lang=b.dataset.lg; save(); renderSettings(); }; });
  $('remToggle').onclick=function(){ state.settings.reminders=!state.settings.reminders; save(); renderSettings(); };
}

applyTheme();
render();
})();
